name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同仓库后续提交取消上一次未完成的部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          # 若仓库已配置 META_TOKEN（带 repo scope 的 PAT），自动开启 Pages；
          # 未配置时退回到网页 Settings → Pages 手动选择「GitHub Actions」作为 Source。
          enablement: ${{ secrets.META_TOKEN != '' }}
          token: ${{ secrets.META_TOKEN || github.token }}

      - name: 生成 Markdown 对应的 HTML 页面
        run: python scripts/md2html.py

      - name: 上传 Pages 构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
