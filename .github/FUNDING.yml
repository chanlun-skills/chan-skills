# 打赏入口配置：保存后仓库右侧会出现 "Sponsor" 按钮
# 使用前请把下面的占位符替换为你的真实 ID
#
# github: 你的GitHub用户名        # 开通 GitHub Sponsors 后填 https://github.com/sponsors/你的用户名
# afdian: 你的爱发电ID            # 在 https://afdian.com/a/你的ID
# custom: ["https://你的收款链接"]
#
# 现阶段先填一个占位，用户可直接改为：
#   github: [your-name]
#   afdian: [your-afdian-id]
