<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" role="img" aria-label="缠论 Skills 系列 banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B1747"/>
      <stop offset="45%" stop-color="#26215C"/>
      <stop offset="100%" stop-color="#3C3489"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.62">
      <stop offset="0%" stop-color="#6C5FD3" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6C5FD3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CFCBE8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8BE0D0"/>
      <stop offset="100%" stop-color="#6FC9F5"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#E17055"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#glow)"/>

  <!-- 背景网格（暗示结构/中枢） -->
  <g stroke="#FFFFFF" stroke-width="1" opacity="0.05">
    <path d="M0 100 H1500 M0 200 H1500 M0 300 H1500 M0 400 H1500"/>
    <path d="M100 0 V500 M300 0 V500 M500 0 V500 M700 0 V500 M900 0 V500 M1100 0 V500 M1300 0 V500"/>
  </g>

  <!-- 左侧：标题区 -->
  <g transform="translate(88, 96)">
    <!-- 徽标 -->
    <g transform="translate(0, 4) scale(0.30)">
      <circle cx="170" cy="170" r="164" fill="none" stroke="url(#ink)" stroke-width="9" opacity="0.28"/>
      <circle cx="170" cy="170" r="164" fill="none" stroke="url(#accent)" stroke-width="9"
              stroke-linecap="round" stroke-dasharray="168 862" transform="rotate(-95 170 170)"/>
      <g stroke="url(#ink)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <polyline points="40,250 80,208 118,222"/>
        <rect x="118" y="156" width="82" height="66" rx="8" stroke-width="11" opacity="0.55"/>
        <polyline points="200,222 216,156 234,120"/>
        <polyline points="234,120 250,182 272,150"/>
      </g>
      <circle cx="272" cy="150" r="24" fill="url(#accent)"/>
    </g>

    <text x="112" y="52" font-family="Microsoft YaHei, PingFang SC, sans-serif"
          font-size="52" font-weight="700" fill="url(#ink)" letter-spacing="3">缠论 Skills 系列</text>

    <text x="114" y="104" font-family="Microsoft YaHei, PingFang SC, sans-serif"
          font-size="22" fill="#A9A3D4" letter-spacing="1.4">让 AI 学会缠论 · 一次开发，多平台可用</text>

    <!-- 六个 skill 标签 -->
    <g font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#E6E3F7">
      <g transform="translate(112, 132)">
        <rect width="132" height="36" rx="18" fill="#FFFFFF" opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.20"/>
        <text x="66" y="24" text-anchor="middle">案例大全</text>
      </g>
      <g transform="translate(254, 132)">
        <rect width="132" height="36" rx="18" fill="#FFFFFF" opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.20"/>
        <text x="66" y="24" text-anchor="middle">三买汇集</text>
      </g>
      <g transform="translate(396, 132)">
        <rect width="132" height="36" rx="18" fill="#FFFFFF" opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.20"/>
        <text x="66" y="24" text-anchor="middle">大盘解盘</text>
      </g>
      <g transform="translate(538, 132)">
        <rect width="146" height="36" rx="18" fill="#FFFFFF" opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.20"/>
        <text x="73" y="24" text-anchor="middle">佛学与禅宗</text>
      </g>
      <g transform="translate(694, 132)">
        <rect width="146" height="36" rx="18" fill="#FFFFFF" opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.20"/>
        <text x="73" y="24" text-anchor="middle">周末音乐会</text>
      </g>
      <g transform="translate(850, 132)">
        <rect width="132" height="36" rx="18" fill="#FFFFFF" opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.20"/>
        <text x="66" y="24" text-anchor="middle">妖股年鉴</text>
      </g>
    </g>

    <!-- 安装命令 -->
    <g transform="translate(112, 196)">
      <rect width="470" height="52" rx="10" fill="#0D0A24" opacity="0.55" stroke="#8BE0D0" stroke-opacity="0.35"/>
      <text x="24" y="33" font-family="Consolas, Menlo, monospace" font-size="18" fill="#8BE0D0">$ npx skills add chanlun-skills/chan-skills</text>
    </g>

    <!-- 合规声明条 -->
    <g transform="translate(112, 272)">
      <rect width="560" height="40" rx="8" fill="url(#warn)" opacity="0.16"/>
      <rect x="0" y="0" width="4" height="40" rx="2" fill="url(#warn)"/>
      <text x="20" y="26" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#F2C88A">
        仅供技术理论学习与历史行情复盘 · 不构成任何投资建议
      </text>
    </g>
  </g>

  <!-- 右侧：缠论结构示意（大图） -->
  <g transform="translate(1000, 118)">
    <!-- K线剪影 -->
    <g opacity="0.30">
      <g stroke="#FFFFFF" stroke-width="8" stroke-linecap="round">
        <path d="M30 60 V118"/><path d="M96 34 V104"/><path d="M162 72 V130"/>
        <path d="M228 24 V88"/><path d="M294 58 V112"/><path d="M360 40 V96"/>
      </g>
      <g fill="#FFFFFF">
        <rect x="18" y="76" width="24" height="26" rx="3"/><rect x="84" y="50" width="24" height="28" rx="3"/>
        <rect x="150" y="90" width="24" height="24" rx="3"/><rect x="216" y="42" width="24" height="26" rx="3"/>
        <rect x="282" y="74" width="24" height="22" rx="3"/><rect x="348" y="56" width="24" height="24" rx="3"/>
      </g>
    </g>

    <!-- 主结构：上升笔 → 中枢 → 离开 → 回试（第三类买点） -->
    <g transform="translate(0, 150)" stroke="url(#ink)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="20,110 84,52 148,74"/>
      <rect x="148" y="6" width="130" height="106" rx="10" stroke-width="11" opacity="0.42"/>
      <polyline points="278,74 302,-24 330,-58"/>
      <polyline points="330,-58 356,42 388,-6"/>
    </g>
    <rect x="148" y="6" width="130" height="106" rx="10" fill="#FFFFFF" opacity="0.08" transform="translate(0,150)"/>

    <!-- 第三类买点 -->
    <circle cx="388" cy="144" r="30" fill="url(#accent)"/>
    <circle cx="388" cy="144" r="30" fill="none" stroke="#26215C" stroke-width="6"/>

    <!-- 标注 -->
    <text x="213" y="288" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif"
          font-size="17" fill="#A9A3D4">日线中枢 · 第三类买点结构</text>
  </g>

  <!-- 底部装饰线 -->
  <g>
    <rect x="88" y="452" width="1324" height="3" rx="1.5" fill="#FFFFFF" opacity="0.10"/>
    <rect x="88" y="452" width="210" height="3" rx="1.5" fill="url(#accent)"/>
  </g>
</svg>
